<div class="panel-filtros">
  <div class="search-bar">
    <input type="text" [ngModel]="termino" (ngModelChange)="onTermino($event)"
           [placeholder]="placeholder" />
  </div>

  @if (mostrarCategoria) {
    <div class="filtro-categoria">
      <select [ngModel]="categoria" (ngModelChange)="onCategoria($event)">
        <option value="">🔍 Todas las categorías</option>
        @for (cat of categorias; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>
  }

  <div class="filtros-toggles">
    <button type="button" class="toggle-chip" [class.active]="ocultarAlergicos" (click)="toggleOcultarAlergicos()">
      🚫 Ocultar alérgicos
    </button>
    <button type="button" class="toggle-chip" [class.active]="ocultarNoDeseados" (click)="toggleOcultarNoDeseados()">
      🚫 Ocultar no deseados
    </button>
  </div>
</div>
